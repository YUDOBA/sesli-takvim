<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sesli Takvim</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="wrap">
    <h1>Sesli Takvim</h1>
    <p class="sub">Konus, ozetle, Google Takvim'e yaz</p>
    <div class="card">
      <button id="mic" class="mic" type="button">Konusmaya basla</button>
      <p class="status" id="status">Once Google'a baglan, sonra konus.</p>
      <label for="transcript">Algilanan metin</label>
      <textarea id="transcript" placeholder="Konusma burada gorunur."></textarea>
      <button id="parseBtn" class="btn" type="button">Metni coz</button>
      <button id="sampleBtn" class="btn ghost" type="button">Ornek cumleyi dene</button>
      <button id="googleBtn" class="btn ghost" type="button">Google Takvim'e baglan</button>
    </div>
    <div class="card" id="editor" hidden>
      <div class="result-head">Sonuc</div>
      <div class="result-row"><div class="result-k">Etkinlik adi</div><div class="result-v" id="previewTitle">-</div></div>
      <div class="result-row"><div class="result-k">Zaman</div><div class="result-v preview-when" id="previewWhen">-</div></div>
      <div class="result-row"><div class="result-k">Sure</div><div class="result-v" id="previewDur">-</div></div>
      <div class="result-row"><div class="result-k">Hatirlatma</div><div class="result-v" id="previewRemind">-</div></div>
      <label for="title">Etkinlik adi</label>
      <input id="title" type="text" />
      <div class="row">
        <div><label for="start">Baslangic</label><input id="start" type="datetime-local" /></div>
        <div><label for="end">Bitis</label><input id="end" type="datetime-local" /></div>
      </div>
      <label for="reminders">Hatirlatma (dakika)</label>
      <input id="reminders" type="text" placeholder="60" />
      <button id="saveBtn" class="btn" type="button">Takvime kaydet</button>
    </div>
  </div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/config.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
